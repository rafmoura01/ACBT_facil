<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6FC; --surface:#FFFFFF; --ink:#0A1A3A; --muted:#4A5A78; --line:#D6E0F0;
  --leaf:#0038A8; --leaf-2:#1E64C8; --mango:#F7B500; --acai:#E8711A;
  --ok:#1E6B4A; --ok-cl:#E1F0E8; --warn:#8A5D0E; --warn-cl:#F8EDD6; --bad:#9A2A35; --bad-cl:#F8E4E6;
  --azul:#1D4E8F; --azul-cl:#E4ECF7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:22px 18px 48px}
.voltar{display:inline-block;color:var(--muted);font-size:.92rem;margin-bottom:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px}
h2{font-family:var(--display);font-size:1.25rem;margin:0 0 10px}
.intro{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:700;margin:0 0 6px}
.dica{font-weight:400;color:var(--muted);font-size:.88rem}
input,textarea{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-bottom:16px}
input:focus{outline:3px solid var(--mango);outline-offset:1px;border-color:var(--leaf-2)}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.prim{width:100%;font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px;background:var(--leaf);color:#FFFFFF;cursor:pointer}
button.prim:disabled{opacity:.6;cursor:wait}
button.sec{width:100%;font:inherit;font-weight:700;border:1.5px solid var(--line);border-radius:12px;padding:11px;background:transparent;color:var(--leaf-2);cursor:pointer;margin-top:10px}
button:focus-visible{outline:3px solid var(--acai);outline-offset:3px}
.erro{background:var(--bad-cl);color:var(--bad);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.95rem}
.oculto{display:none !important}
.abas{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px}
.abas button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;color:var(--muted);padding:10px;border-radius:10px;cursor:pointer}
.abas button[aria-selected=true]{background:var(--leaf);color:#FFFFFF}
.pendente{background:var(--bad-cl);color:var(--bad);border-radius:18px;padding:18px;margin-bottom:14px}
.pendente b{display:block;font-family:var(--display);font-size:1.35rem}
.pendente a{color:inherit;font-weight:700}

/* calendário */
.cal-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-topo h2{margin:0;text-transform:capitalize}
.nav{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1.2rem;cursor:pointer;color:var(--ink)}
.nav:disabled{opacity:.3;cursor:default}
.grade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sem{text-align:center;font-size:.78rem;color:var(--muted);padding-bottom:2px}
.dia{aspect-ratio:1;border-radius:10px;border:1.5px solid transparent;font:inherit;font-weight:700;cursor:pointer;background:#2E7D4F;color:#FFFFFF;padding:0}
.dia.fora{background:transparent;color:#B7C0BA;font-weight:400;cursor:default}
.dia.ocupado{background:#C62828;color:#D6E6FF;cursor:default;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#D6E6FF}
.dia.bloqueado{background:#F2C230;color:#3A2E00;cursor:default;text-decoration:line-through;text-decoration-thickness:2px}
.dia.sua{background:#1D4E8F;color:#FFFFFF;cursor:default}
.dia.sel{background:#002266;color:#FFFFFF;box-shadow:inset 0 0 0 3px #FFD200}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.escolhida{font-family:var(--display);font-size:1.3rem;font-weight:700;margin:0 0 12px}
.taxa{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.regras{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.92rem;margin-bottom:10px;white-space:pre-wrap}
.tipos{display:grid;gap:8px;margin-bottom:16px}
.tipo{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:400;margin:0}
.tipo input{width:20px;height:20px;margin:2px 0 0;flex:none}
.tipo b{display:block}
.tipo:has(input:checked){border-color:var(--leaf);background:#E6EFFC}
.st.Quitada{background:var(--ok-cl);color:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-bottom:16px}
.chk input{width:22px;height:22px;margin:2px 0 0;flex:none}
.sucesso{text-align:center}
.sucesso .proto{font-family:var(--display);font-weight:800;font-size:2.3rem;color:var(--leaf);margin:4px 0}

/* minhas reservas */
.res{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;background:var(--surface)}
.res .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.res .d{font-weight:700;text-transform:capitalize}
.res .c{color:var(--muted);font-size:.88rem}
.st{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st.Solicitada{background:var(--warn-cl);color:var(--warn)}
.st.Aprovada{background:var(--azul-cl);color:var(--azul)}
.st.Confirmada{background:var(--ok-cl);color:var(--ok)}
.st.Recusada,.st.Cancelada{background:var(--bg);color:var(--muted)}
.pagar{background:var(--azul-cl);color:var(--azul);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:.95rem}
.pagar input{margin:8px 0 0;background:#fff;font-weight:700}
.vazio{text-align:center;color:var(--muted);padding:24px 10px}
</style>
</head>
<body>
<div class="wrap">
  <a class="voltar" id="linkHub" href="#">‹ Voltar ao ACBT Fácil</a>
  <h1>Área de lazer</h1>
  <p class="intro" id="intro">Reserve o dia inteiro para o seu evento.</p>

  <!-- LOGIN -->
  <div class="card" id="login">
    <h2>Confirme que você é morador</h2>
    <label for="saram">SARAM <span class="dica">7 dígitos</span></label>
    <input id="saram" inputmode="numeric" maxlength="7" autocomplete="off">
    <label for="cpf4">4 últimos dígitos do CPF <span class="dica">ex.: CPF terminado em 789-01 → digite 8901</span></label>
    <input id="cpf4" inputmode="numeric" maxlength="4" autocomplete="off">
    <button class="prim" id="btnEntrar">Continuar</button>
    <div class="erro oculto" id="erroLogin" role="alert"></div>
  </div>

  <section id="app" class="oculto">
    <div class="abas" role="tablist">
      <button role="tab" aria-selected="true" data-aba="reservar">Reservar</button>
      <button role="tab" aria-selected="false" data-aba="minhas">Minhas reservas</button>
    </div>

    <!-- RESERVAR -->
    <div id="abaReservar">
      <div class="pendente oculto" id="pendente"></div>

      <div id="blocoCal">
        <div class="card">
          <div class="cal-topo">
            <button class="nav" id="mesAnt" aria-label="Mês anterior">‹</button>
            <h2 id="mesTitulo"></h2>
            <button class="nav" id="mesProx" aria-label="Próximo mês">›</button>
          </div>
          <div class="grade" id="grade"><span class="dica">Carregando…</span></div>
          <div class="leg">
            <span><i style="background:#2E7D4F"></i>Livre</span>
            <span><i style="background:#C62828"></i>Reservado</span>
            <span><i style="background:#F2C230"></i>Uso da associação</span>
            <span><i style="background:#1D4E8F"></i>Sua reserva</span>
          </div>
        </div>

        <div class="card oculto" id="form">
          <p class="escolhida" id="escolhida"></p>
          <div class="fila">
            <div><label for="tel">Telefone com DDD</label><input id="tel" inputmode="tel" maxlength="15" placeholder="(91) 90000-0000"></div>
            <div><label for="pnr">PNR</label><input id="pnr" placeholder="ex.: 12-B"></div>
          </div>
          <label>De quem é o evento?</label>
          <div class="tipos" id="tipos">
            <label class="tipo"><input type="radio" name="tipo" value="morador"><span><b>Meu evento</b><span class="dica" id="vMorador"></span></span></label>
            <label class="tipo"><input type="radio" name="tipo" value="terceiros"><span><b>Evento de terceiros, no meu nome</b><span class="dica" id="vTerceiros"></span></span></label>
          </div>
          <div id="campoResp" class="oculto">
            <label for="resp">Responsável pelo evento <span class="dica">quem vai usar o espaço</span></label>
            <input id="resp" placeholder="Nome da pessoa">
          </div>
          <div class="fila">
            <div><label for="evento">Evento <span class="dica">opcional</span></label><input id="evento" placeholder="ex.: aniversário"></div>
            <div><label for="conv">Convidados <span class="dica">aprox.</span></label><input id="conv" inputmode="numeric" maxlength="4"></div>
          </div>
          <div class="taxa" id="taxa"></div>
          <label>Regras de uso</label>
          <div class="regras" id="regras"></div>
          <label class="chk"><input type="checkbox" id="aceite"> Li e aceito as regras de uso da área de lazer.</label>
          <button class="prim" id="btnPedir">Pedir reserva</button>
          <div class="erro oculto" id="erroPedido" role="alert"></div>
        </div>

        <div class="card sucesso oculto" id="ok" aria-live="polite">
          <p>Pedido enviado para</p>
          <p class="escolhida" id="okData" style="margin:0"></p>
          <div class="proto" id="okProto"></div>
          <p class="dica">A diretoria vai analisar e avisar pelo telefone informado. Acompanhe em “Minhas reservas”.</p>
          <button class="prim" id="btnVerMinhas">Ver minhas reservas</button>
        </div>
      </div>
    </div>

    <!-- MINHAS -->
    <div id="abaMinhas" class="oculto">
      <div id="minhas"></div>
    </div>
  </section>
</div>

<script>
const LINK_HUB = "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec";
document.getElementById("linkHub").href = LINK_HUB;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl = v => "R$ " + (v || 0).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
const SEMANA = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const ROT = { livre:"livre", fora:"fora do prazo", ocupado:"reservado", bloqueado:"uso da associação", sua:"sua reserva" };
let taxas = { morador: 0, terceiros: 0 };
const tipoEscolhido = () => (document.querySelector('input[name="tipo"]:checked') || {}).value || "";
const metade = v => Math.round(v * 50) / 100;
function atualizarTaxa(){
  const t = tipoEscolhido();
  $("campoResp").classList.toggle("oculto", t !== "terceiros");
  if(!t){ $("taxa").innerHTML = "Escolha de quem é o evento para ver o valor."; return; }
  const total = taxas[t], sinal = metade(total), resto = Math.round((total - sinal) * 100) / 100;
  $("taxa").innerHTML = `Taxa de uso: <b>${brl(total)}</b>, paga em duas partes:<br>
    <b>${brl(sinal)}</b> de sinal, depois que a diretoria aprovar, para confirmar a reserva;<br>
    <b>${brl(resto)}</b> restantes até o dia do evento.`;
}
document.querySelectorAll('input[name="tipo"]').forEach(i => i.addEventListener("change", atualizarTaxa));
let token = "", perfil = null, cal = null, mesVisto = "", escolhida = "";

function servidor(fn, ...args){
  return new Promise((ok, erro) => google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](...args));
}
function mostrarErro(id, msg){ $(id).textContent = msg; $(id).classList.remove("oculto"); }
function mascaraTelefone(v){
  const d = String(v || "").replace(/\D/g, "").slice(0, 11);
  if(d.length <= 2) return d.length ? "(" + d : "";
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
$("tel").addEventListener("input", e => { e.target.value = mascaraTelefone(e.target.value); });
["saram","cpf4","conv"].forEach(id => $(id).addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); }));

function sessaoExpirou(e){
  if(!/SESSAO/.test(String(e && e.message || e))) return false;
  token = "";
  $("app").classList.add("oculto");
  $("login").classList.remove("oculto");
  mostrarErro("erroLogin", "Sua sessão expirou. Confirme os dados de novo.");
  return true;
}

/* ---------- login ---------- */
$("cpf4").addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
$("btnEntrar").addEventListener("click", entrar);
async function entrar(){
  const btn = $("btnEntrar");
  $("erroLogin").classList.add("oculto");
  btn.disabled = true; btn.textContent = "Conferindo…";
  try{
    const r = await servidor("entrarReserva", $("saram").value, $("cpf4").value);
    if(!r.ok) return mostrarErro("erroLogin", r.msg);
    token = r.token; perfil = r;
    $("login").classList.add("oculto");
    $("app").classList.remove("oculto");
    $("intro").textContent = "Olá, " + r.nome.split(" ")[0].charAt(0) + r.nome.split(" ")[0].slice(1).toLowerCase() + ".";
    $("pnr").value = r.pnr || "";
    $("tel").value = mascaraTelefone(r.telefone || "");
    $("regras").textContent = r.regras || "Siga as orientações da diretoria para o uso do espaço.";
    taxas = r.taxas;
    $("vMorador").textContent = "Taxa de " + brl(taxas.morador);
    $("vTerceiros").textContent = "Taxa de " + brl(taxas.terceiros) + ". Você continua responsável pelo espaço.";
    atualizarTaxa();
    if(!r.emDia){
      $("pendente").innerHTML = r.encerrado
        ? `<b>Cadastro encerrado</b>Seu cadastro no conjunto está encerrado. Fale com a diretoria.`
        : `<b>${brl(r.pendencia)} em aberto</b>Para reservar, é preciso estar em dia com a mensalidade e a taxa de água. <a href="${LINK_HUB}?p=consulta">Ver os meses pendentes</a>.`;
      $("pendente").classList.remove("oculto");
      $("blocoCal").classList.add("oculto");
    }else{
      await carregarCal();
    }
  }catch(_){
    mostrarErro("erroLogin", "Não foi possível conferir agora. Tente de novo.");
  }finally{
    btn.disabled = false; btn.textContent = "Continuar";
  }
}

/* ---------- abas ---------- */
document.querySelectorAll(".abas button").forEach(b => b.addEventListener("click", () => irPara(b.dataset.aba)));
function irPara(aba){
  document.querySelectorAll(".abas button").forEach(o => o.setAttribute("aria-selected", String(o.dataset.aba === aba)));
  $("abaReservar").classList.toggle("oculto", aba !== "reservar");
  $("abaMinhas").classList.toggle("oculto", aba !== "minhas");
  if(aba === "minhas") carregarMinhas();
}

/* ---------- calendário ---------- */
const mesMais = (ym, n) => { let [a, m] = ym.split("-").map(Number); m += n;
  while(m > 12){ m -= 12; a++; } while(m < 1){ m += 12; a--; } return a + "-" + String(m).padStart(2, "0"); };
const semanaDe = iso => { const [a,m,d] = iso.split("-").map(Number); return SEMANA[new Date(Date.UTC(a,m-1,d)).getUTCDay()]; };
const dataBr = iso => iso.slice(8,10) + "/" + iso.slice(5,7) + "/" + iso.slice(0,4);

async function carregarCal(){
  try{
    cal = await servidor("calendarioReservas", token);
    if(!mesVisto) mesVisto = cal.min.slice(0, 7);
    renderCal();
  }catch(e){ if(!sessaoExpirou(e)) $("grade").innerHTML = '<span class="dica">Não consegui carregar o calendário.</span>'; }
}

function renderCal(){
  const [a, m] = mesVisto.split("-").map(Number);
  const inicio = new Date(Date.UTC(a, m - 1, 1)).getUTCDay();
  const total = new Date(Date.UTC(a, m, 0)).getUTCDate();
  let html = SEM.map(s => `<div class="sem">${s}</div>`).join("") + "<div></div>".repeat(inicio);
  for(let d = 1; d <= total; d++){
    const iso = `${a}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const st = (iso < cal.min || iso > cal.max) ? "fora" : (cal.dias[iso] || "livre");
    html += `<button class="dia ${st}${iso === escolhida ? " sel" : ""}" data-iso="${iso}" ${st !== "livre" ? "disabled" : ""}
              aria-label="${d} de ${MESES[m-1]}, ${ROT[st]}">${d}</button>`;
  }
  $("grade").innerHTML = html;
  $("mesTitulo").textContent = MESES[m - 1] + " " + a;
  $("mesAnt").disabled = mesVisto <= cal.min.slice(0, 7);
  $("mesProx").disabled = mesVisto >= cal.max.slice(0, 7);
  $("grade").querySelectorAll(".dia.livre").forEach(b => b.addEventListener("click", () => escolher(b.dataset.iso)));
}
$("mesAnt").addEventListener("click", () => { mesVisto = mesMais(mesVisto, -1); renderCal(); });
$("mesProx").addEventListener("click", () => { mesVisto = mesMais(mesVisto, 1); renderCal(); });

function escolher(iso){
  escolhida = iso;
  renderCal();
  $("escolhida").textContent = semanaDe(iso) + ", " + dataBr(iso);
  $("erroPedido").classList.add("oculto");
  $("ok").classList.add("oculto");
  $("form").classList.remove("oculto");
  $("form").scrollIntoView({ behavior:"smooth", block:"start" });
}

$("btnPedir").addEventListener("click", async () => {
  const btn = $("btnPedir");
  $("erroPedido").classList.add("oculto");
  if(!tipoEscolhido()) return mostrarErro("erroPedido", "Informe se o evento é seu ou de terceiros.");
  if(!$("aceite").checked) return mostrarErro("erroPedido", "Marque que você leu e aceita as regras de uso.");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const r = await servidor("solicitarReserva", token, {
      data: escolhida, telefone: $("tel").value, pnr: $("pnr").value,
      evento: $("evento").value, convidados: $("conv").value, aceite: true,
      tipo: tipoEscolhido(), responsavel: $("resp").value
    });
    if(!r.ok){ mostrarErro("erroPedido", r.msg); await carregarCal(); return; }
    $("okData").textContent = r.semana + ", " + r.dataBr;
    $("okProto").textContent = r.protocolo;
    $("form").classList.add("oculto");
    $("ok").classList.remove("oculto");
    escolhida = ""; $("aceite").checked = false; $("evento").value = ""; $("conv").value = ""; $("resp").value = "";
    document.querySelectorAll('input[name="tipo"]').forEach(i => i.checked = false); atualizarTaxa();
    await carregarCal();
    $("ok").scrollIntoView({ behavior:"smooth", block:"start" });
  }catch(e){
    if(!sessaoExpirou(e)) mostrarErro("erroPedido", "Não foi possível enviar agora. Tente de novo.");
  }finally{
    btn.disabled = false; btn.textContent = "Pedir reserva";
  }
});
$("btnVerMinhas").addEventListener("click", () => irPara("minhas"));

/* ---------- minhas reservas ---------- */
async function carregarMinhas(){
  $("minhas").innerHTML = '<div class="vazio">Carregando…</div>';
  try{
    const r = await servidor("minhasReservas", token);
    renderMinhas(r.reservas);
  }catch(e){ if(!sessaoExpirou(e)) $("minhas").innerHTML = '<div class="vazio">Não consegui carregar suas reservas.</div>'; }
}

function renderMinhas(lista){
  $("minhas").innerHTML = lista.length ? lista.map(x => `
    <div class="res">
      <div class="top"><span class="d">${esc(x.semana)}, ${esc(x.dataBr)}</span><span class="st ${esc(x.status)}">${esc(x.statusTexto)}</span></div>
      <div class="c">${esc(x.protocolo)} · ${esc(x.tipo)}${x.evento ? " · " + esc(x.evento) : ""} · ${brl(x.taxa)}</div>
      ${x.obs && (x.status === "Recusada" || x.status === "Cancelada") ? `<div class="c">Motivo: ${esc(x.obs)}</div>` : ""}
      ${x.pagar ? `<div class="pagar">${x.pagar.parcela === "sinal"
          ? `Para confirmar a reserva, pague o sinal de <b>${brl(x.pagar.valor)}</b>`
          : `Sinal recebido. Pague os <b>${brl(x.pagar.valor)}</b> restantes até <b>${esc(x.pagar.ate)}</b>`}
        por PIX${x.pagar.favorecido ? " para " + esc(x.pagar.favorecido) : ""} e envie o comprovante à diretoria.
        ${x.pagar.pix ? `<input readonly value="${esc(x.pagar.pix)}" aria-label="Chave PIX" onclick="this.select()">` : "<br>A diretoria vai informar a chave PIX."}</div>` : ""}
      ${x.podeCancelar ? `<button class="sec" data-cancelar="${esc(x.protocolo)}">Cancelar esta reserva</button>` : ""}
    </div>`).join("")
    : '<div class="vazio">Você ainda não tem reservas.</div>';

  $("minhas").querySelectorAll("[data-cancelar]").forEach(b => b.addEventListener("click", async () => {
    if(b.dataset.armado !== "1"){
      b.dataset.armado = "1"; b.textContent = "Toque de novo para confirmar o cancelamento";
      setTimeout(() => { if(b.dataset.armado === "1" && !b.disabled){ b.dataset.armado = ""; b.textContent = "Cancelar esta reserva"; } }, 5000);
      return;
    }
    b.disabled = true; b.textContent = "Cancelando…";
    try{
      const r = await servidor("cancelarMinhaReserva", token, b.dataset.cancelar);
      if(!r.ok){ alert(r.msg); b.disabled = false; b.textContent = "Cancelar esta reserva"; return; }
      renderMinhas(r.reservas);
      carregarCal();
    }catch(e){ if(!sessaoExpirou(e)){ b.disabled = false; b.textContent = "Cancelar esta reserva"; } }
  }));
}

/* ---------- App instalado: troca de página sem sair do app ---------- */
(function(){
  const EXEC_APP = "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec";
  let dentroDoApp = false;
  try{ google.script.url.getLocation(l => { dentroDoApp = !!(l.parameter && l.parameter.app === "1"); }); }catch(_){}
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[href]");
    if(!a || !dentroDoApp) return;
    const href = a.getAttribute("href") || "";
    if(href.indexOf(EXEC_APP) !== 0) return;
    e.preventDefault();
    window.top.postMessage({ acbt: "ir", url: href + (href.indexOf("?") > -1 ? "&" : "?") + "app=1" }, "*");
  }, true);
})();
</script>
