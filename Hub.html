<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACBT Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6FC; --surface:#FFFFFF; --ink:#0A1A3A; --muted:#4A5A78;
  --leaf:#0038A8; --leaf-2:#1E64C8; --mango:#F7B500; --acai:#E8711A;
  --line:#D6E0F0; --on-leaf:#FFFFFF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061430; --surface:#0D2147; --ink:#EAF1FF; --muted:#A9BBDD;
    --leaf:#2A6FD6; --leaf-2:#5B9BEA; --mango:#FFD200; --acai:#F39200;
    --line:#1D3A6E; --on-leaf:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#061430; --surface:#0D2147; --ink:#EAF1FF; --muted:#A9BBDD;
  --leaf:#2A6FD6; --leaf-2:#5B9BEA; --mango:#FFD200; --acai:#F39200;
  --line:#1D3A6E; --on-leaf:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 18px 48px}

/* Topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand img{height:64px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,40,120,.22))}
.brand span{display:block}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.date{color:var(--muted);font-size:.9rem;text-align:right}

/* Saudação */
.hello h1{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 6px;max-width:14ch}
.hello p{margin:0 0 22px;color:var(--muted);max-width:44ch}

/* Aviso */
.notice{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-left:6px solid var(--acai);border-radius:4px 14px 14px 4px;padding:14px 16px;margin-bottom:28px}
.notice svg{flex:none;width:26px;height:26px;color:var(--acai);margin-top:2px}
.notice strong{display:block;font-size:.95rem}
.notice span{color:var(--muted);font-size:.95rem}

/* Serviços principais */
.main{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:34px}
@media (min-width:720px){.main{grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr}.main .tile:first-child{grid-row:span 2}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:18px;text-decoration:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:132px;padding:20px;border-radius:22px;background:var(--leaf);color:var(--on-leaf);overflow:hidden}
.tile:nth-child(2){background:#2F6B63;color:#FFFFFF}
.tile:nth-child(3){background:#C9580A}
.tile .ic{width:44px;height:44px}
.tile h2{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.1;letter-spacing:-.02em;margin:0 0 4px}
.tile p{margin:0;opacity:.88;font-size:.98rem;max-width:32ch}
.main .tile:first-child{min-height:200px}
.main .tile:first-child h2{font-size:clamp(1.8rem,5vw,2.4rem)}
.tile .leaf-bg{position:absolute;right:-30px;bottom:-40px;width:180px;height:180px;opacity:.13;pointer-events:none}

/* Outros serviços */
.sec-title{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 12px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.small{display:flex;flex-direction:column;gap:10px;text-decoration:none;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;min-height:118px}
.small svg{width:30px;height:30px;color:var(--leaf-2)}
.small b{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.15}
.small span{color:var(--muted);font-size:.88rem;line-height:1.35}
.soon{align-self:flex-start;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}
.tile .soon{background:rgba(255,255,255,.22);color:inherit;position:absolute;top:16px;right:16px}

.tile:focus-visible,.small:focus-visible,.sheet button:focus-visible,.phone:focus-visible{outline:3px solid var(--acai);outline-offset:3px}
@media (hover:hover){.small:hover{border-color:var(--leaf-2)}.tile:hover{filter:brightness(1.06)}}

footer{margin-top:40px;color:var(--muted);font-size:.85rem;line-height:1.5;border-top:1px solid var(--line);padding-top:16px}

/* Folha de telefones */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.5);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s ease;z-index:21;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.scrim.open{display:block}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h3{font-family:var(--display);font-size:1.5rem;margin:0}
.sheet button.close{border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;padding:8px 14px;border-radius:99px;cursor:pointer}
.group{margin-top:18px}
.group h4{margin:0 0 6px;font-size:.95rem;color:var(--muted);font-weight:700}
.phone{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.phone:last-child{border-bottom:0}
.phone .n{font-weight:700}
.phone .d{color:var(--muted);font-size:.88rem;display:block}
.phone .num{flex:none;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--leaf-2);display:flex;align-items:center;gap:6px}
.phone .num svg{width:18px;height:18px}

.sheet-intro{margin:4px 0 14px;color:var(--muted)}
.choice{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.choice svg{flex:none;width:30px;height:30px;color:var(--leaf-2);margin-top:2px}
.choice b{display:block;font-family:var(--display);font-size:1.15rem;margin-bottom:2px}
.choice span span{color:var(--muted);font-size:.93rem}
.choice:focus-visible{outline:3px solid var(--acai);outline-offset:3px}
@media (hover:hover){.choice:hover{border-color:var(--leaf-2)}}

/* Aviso rápido (toast) */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.95rem;transition:transform .25s ease;z-index:30;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>

  <section class="hello">
    <h1 id="saudacao">Bom dia, morador</h1>
    <p>Os serviços do Conjunto Habitacional Bandeirante em um só lugar.</p>
  </section>

  <div class="notice" id="aviso" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <div><strong id="aviso-titulo"></strong><span id="aviso-texto"></span></div>
  </div>

  <section class="main" id="principais" aria-label="Serviços principais"></section>

  <h2 class="sec-title">Mais serviços</h2>

  <footer>
    Associação da Administração dos Compossuidores do Conjunto Habitacional Bandeirante (ACBT) · Belém, PA
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <h3 id="sheet-title"></h3>
    <button class="close" id="fechar">Fechar</button>
  </div>
  <div id="sheet-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — edite aqui. Não precisa mexer no resto do código.
   url: link do app/formulário. Deixe "" para mostrar "Em breve".
   ===================================================================== */
const AVISO = {
  titulo: "Aviso da diretoria",
  texto: "A mensalidade vence no dia 10. Dúvidas? Fale com a administração."
};

const PRINCIPAIS = [
  { titulo:"Chamados", desc:"Abra ou acompanhe pedidos de manutenção, iluminação, portão e limpeza.", icone:"chamado", acao:"chamado" },
  { titulo:"Reservar área de lazer", desc:"Veja datas livres e peça a reserva do seu evento.", icone:"calendario", acao:"reserva" },
  { titulo:"Mensalidade e água", desc:"Veja se está em dia e quais meses estão pendentes.", icone:"pagamento", acao:"mensalidade" }
];

/* Links do botão "Reservar área de lazer" */
const RESERVAS = {
  morador: "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec?p=reserva",
  diretoria: "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec?p=painel&aba=reservas"
};

/* Links do botão "Chamados" */
const CHAMADOS = {
  morador: "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec?p=chamado",
  diretoria: "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec?p=painel"
};

/* Links do botão "Mensalidade e água" */
const MENSALIDADE = {
  morador: "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec?p=consulta",
  diretoria: "https://script.google.com/macros/s/AKfycbzz8Cnhw7TfpYNtPkU0QJlANKbePFbwq9Ut8YkPtcBDtOxI2Tx_iSTS6LMMKCoyxZzUFw/exec"
};

const OUTROS = [
  { titulo:"Telefones úteis", desc:"Portaria, diretoria e emergências.", icone:"telefone", acao:"telefones" },
  { titulo:"Mural de avisos", desc:"Comunicados da diretoria.", icone:"mural", url:"" },
  { titulo:"Documentos", desc:"Estatuto, regimento e atas.", icone:"documento", url:"" },
  { titulo:"Prestação de contas", desc:"Receitas e despesas da associação.", icone:"contas", url:"" },
  { titulo:"Assembleias", desc:"Datas, pautas e resultados.", icone:"assembleia", url:"" },
  { titulo:"Visitantes", desc:"Avise a portaria sobre quem vai chegar.", icone:"visitante", url:"" },
  { titulo:"Sugestões", desc:"Envie ideias e reclamações.", icone:"sugestao", url:"" },
  { titulo:"Falar no WhatsApp", desc:"Contato direto com a administração.", icone:"whatsapp", url:"" }
];

const TELEFONES = [
  { grupo:"Conjunto Bandeirante", itens:[
    { nome:"Portaria / Guarita", desc:"Atendimento 24 horas", numero:"" },
    { nome:"Administração da ACBT", desc:"Seg. a sex., horário comercial", numero:"" },
    { nome:"Presidência", desc:"Assuntos da diretoria", numero:"" }
  ]},
  { grupo:"Emergências", itens:[
    { nome:"SAMU", desc:"Urgência médica", numero:"192" },
    { nome:"Corpo de Bombeiros", desc:"Incêndio e resgate", numero:"193" },
    { nome:"Polícia Militar", desc:"Segurança", numero:"190" },
    { nome:"Defesa Civil", desc:"Alagamentos e riscos", numero:"199" }
  ]},
  { grupo:"Serviços", itens:[
    { nome:"Energia elétrica", desc:"Falta de luz", numero:"" },
    { nome:"Água e esgoto", desc:"Falta d'água e vazamentos", numero:"" }
  ]}
];
/* ===================== fim da configuração ===================== */

const ICONES = {
  chamado:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4Z"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>',
  pagamento:'<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/>',
  telefone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  mural:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
  documento:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  contas:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  assembleia:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M14 20a4.5 4.5 0 0 1 7.5-3.4"/>',
  visitante:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  sugestao:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5A8 8 0 1 1 21 12Z"/><path d="M9 12h.01M13 12h.01M17 12h.01"/>',
  whatsapp:'<path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.3 3.2Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8a4 4 0 0 1-2.1-2.1l.8-1-1-2Z"/>'
};
const svg = (nome, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[nome]||''}</svg>`;
const folha = `<svg class="leaf-bg" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 5c25 16 38 36 38 55a38 38 0 0 1-76 0C12 41 25 21 50 5Z" fill="currentColor"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function atributos(item){
  if (item.url) return `href="${esc(item.url)}" target="_blank" rel="noopener"`;
  return `href="#" data-acao="${item.acao || 'embreve'}" data-titulo="${esc(item.titulo)}"`;
}

document.getElementById('principais').innerHTML = PRINCIPAIS.map(i => `
  <a class="tile" ${atributos(i)}>
    ${folha}
    ${!i.url && !i.acao ? '<span class="soon">Em breve</span>' : ''}
    ${svg(i.icone,'ic')}
    <div><h2>${esc(i.titulo)}</h2><p>${esc(i.desc)}</p></div>
  </a>`).join('');

document.getElementById('outros').innerHTML = OUTROS.map(i => `
  <a class="small" ${atributos(i)}>
    ${svg(i.icone)}
    <b>${esc(i.titulo)}</b>
    <span>${esc(i.desc)}</span>
    ${!i.url && !i.acao ? '<span class="soon">Em breve</span>' : ''}
  </a>`).join('');

const htmlTelefones = TELEFONES.map(g => `
  <div class="group"><h4>${esc(g.grupo)}</h4>
    ${g.itens.map(t => t.numero ? `
      <a class="phone" href="tel:${esc(t.numero.replace(/\D/g,''))}">
        <span><span class="n">${esc(t.nome)}</span><span class="d">${esc(t.desc)}</span></span>
        <span class="num">${svg('telefone')}${esc(t.numero)}</span>
      </a>` : `
      <div class="phone">
        <span><span class="n">${esc(t.nome)}</span><span class="d">${esc(t.desc)}</span></span>
        <span class="num" style="color:var(--muted);font-size:.9rem">A informar</span>
      </div>`).join('')}
  </div>`).join('');

// Aviso
document.getElementById('aviso-titulo').textContent = AVISO.titulo;
document.getElementById('aviso-texto').textContent = AVISO.texto;
if (!AVISO.texto) document.getElementById('aviso').remove();

// Data e saudação
const agora = new Date();
const h = agora.getHours();
document.getElementById('saudacao').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', morador';
const dataTxt = agora.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('hoje').textContent = dataTxt.charAt(0).toUpperCase() + dataTxt.slice(1);

// Toast
const toast = document.getElementById('toast'); let tt;
function avisar(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>toast.classList.remove('show'), 2600); }

// Folha de telefones
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
let ultimoFoco = null;
const htmlMensalidade = `
  <p class="sheet-intro">Escolha como você quer entrar.</p>
  <a class="choice" ${MENSALIDADE.morador ? `href="${esc(MENSALIDADE.morador)}"` : 'href="#" data-acao="embreve" data-titulo="Consulta do morador"'}>
    ${svg('visitante')}
    <span><b>Sou morador</b><span>Consulte se está em dia e os meses pendentes da mensalidade e da taxa de água.</span></span>
  </a>
  <a class="choice" href="${esc(MENSALIDADE.diretoria)}" target="_blank" rel="noopener">
    ${svg('contas')}
    <span><b>Sou da diretoria</b><span>Abre o app de gestão. Exige login com a conta Google autorizada.</span></span>
  </a>`;
const htmlChamados = `
  <p class="sheet-intro">Escolha como você quer entrar.</p>
  <a class="choice" href="${esc(CHAMADOS.morador)}">
    ${svg('visitante')}
    <span><b>Sou morador</b><span>Abra um chamado ou acompanhe os seus.</span></span>
  </a>
  <a class="choice" href="${esc(CHAMADOS.diretoria)}">
    ${svg('contas')}
    <span><b>Sou da diretoria</b><span>Responda os chamados. Exige e-mail e senha de responsável.</span></span>
  </a>`;
const htmlReservas = `
  <p class="sheet-intro">Escolha como você quer entrar.</p>
  <a class="choice" href="${esc(RESERVAS.morador)}">
    ${svg('visitante')}
    <span><b>Sou morador</b><span>Veja as datas livres e peça sua reserva. É preciso estar em dia com a mensalidade e a água.</span></span>
  </a>
  <a class="choice" href="${esc(RESERVAS.diretoria)}">
    ${svg('contas')}
    <span><b>Sou da diretoria</b><span>Aprove pedidos, registre pagamentos e bloqueie datas.</span></span>
  </a>`;
const FOLHAS = {
  reserva: { titulo: 'Área de lazer', html: htmlReservas },
  chamado: { titulo: 'Chamados', html: htmlChamados },
  telefones: { titulo: 'Telefones úteis', html: htmlTelefones },
  mensalidade: { titulo: 'Mensalidade e água', html: htmlMensalidade }
};
function abrir(tipo){
  document.getElementById('sheet-title').textContent = FOLHAS[tipo].titulo;
  document.getElementById('sheet-body').innerHTML = FOLHAS[tipo].html;
  ultimoFoco = document.activeElement; sheet.hidden = false; requestAnimationFrame(()=>{ sheet.classList.add('open'); scrim.classList.add('open'); }); document.getElementById('fechar').focus(); }
function fechar(){ sheet.classList.remove('open'); scrim.classList.remove('open'); setTimeout(()=>{ sheet.hidden = true; }, 280); if (ultimoFoco) ultimoFoco.focus(); }
document.getElementById('fechar').onclick = fechar;
scrim.onclick = fechar;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) fechar(); });

document.addEventListener('click', e => {
  const a = e.target.closest('[data-acao]');
  if (!a) return;
  e.preventDefault();
  if (FOLHAS[a.dataset.acao]) abrir(a.dataset.acao);
  else avisar(`"${a.dataset.titulo}" estará disponível em breve.`);
});

/* ---------- App instalado: troca de página sem sair do app ---------- */
(function(){
  const EXEC_APP = "https://script.google.com/macros/s/AKfycbxzgOl8IVkikR6DhFU0BcP_sR1y21PGR5VN3MmnPCoRgPlCqZovzY6W3aH5YKugw57obA/exec";
  let dentroDoApp = false;
  try{ google.script.url.getLocation(l => { dentroDoApp = !!(l.parameter && l.parameter.app === "1"); }); }catch(_){}
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[href]");
    if(!a || !dentroDoApp) return;
    const href = a.getAttribute("href") || "";
    if(href.indexOf(EXEC_APP) !== 0) return;
    e.preventDefault();
    window.top.postMessage({ acbt: "ir", url: href + (href.indexOf("?") > -1 ? "&" : "?") + "app=1" }, "*");
  }, true);
})();
</script>
